name: fitbirek_training
description: "FitBirek - osobisty asystent treningowy do treningow domowych."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking (przygotowane na przyszlosc)
  dio: ^5.7.0
  dio_web_adapter: ^2.2.2

  # Local database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Simple settings storage
  shared_preferences: 2.5.3

  # Secure storage (na przyszle tokeny JWT)
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.0

  # Formatowanie PL
  intl: ^0.20.2

  # Permissions & notifications
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # Audio (gong)
  audioplayers: ^6.1.0

  # Ekran aktywny podczas treningu
  wakelock_plus: ^1.2.8

  # Export dziennika
  share_plus: ^10.1.2
  file_picker: ^8.1.4

  # Utils
  uuid: ^4.5.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/sounds/
