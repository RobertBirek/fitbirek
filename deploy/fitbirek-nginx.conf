# =====================================================================
# Nginx config dla FitBirek (Flutter Web) — fit.birek.online
# Umieść jako: /etc/nginx/sites-available/fit.birek.online
# Aktywuj:     sudo ln -s /etc/nginx/sites-available/fit.birek.online /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fit.birek.online;

    root /var/www/fitbirek/web;
    index index.html;

    # --- KRYTYCZNE: poprawny typ MIME dla .wasm ---
    # Bez tego niektóre serwery serwują sqlite3.wasm jako
    # application/octet-stream i przegladarka odmawia go zaladowac
    # jako modul WebAssembly -> baza danych (Drift) nie wystartuje.
    types {
        application/wasm wasm;
    }

    # --- Gzip dla szybszego ladowania (main.dart.js jest ~3.6MB) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    # --- Cache dla statycznych assetow (mają hash w nazwie / rzadko się zmieniają) ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- main.dart.js, flutter.js itp. — krotszy cache (mogą się zmieniać przy update) ---
    location ~* \.(js|wasm)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # --- SPA fallback: Flutter Web routing (GoRouter) obsługuje wszystko po stronie klienta ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- service worker: NIGDY nie cache'ować (musi się zawsze odświeżać) ---
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# =====================================================================
# UWAGA dot. Drift WasmDatabase (baza danych na Web):
# Standardowo NIE wymaga nagłówków COOP/COEP (Cross-Origin-Opener-Policy /
# Cross-Origin-Embedder-Policy) w trybie domyślnym (IndexedDB fallback).
# Jeśli w konsoli przeglądarki zobaczysz błędy związane z
# "SharedArrayBuffer" lub OPFS, odkomentuj poniższy blok w sekcji `location /`:
#
#   add_header Cross-Origin-Opener-Policy "same-origin";
#   add_header Cross-Origin-Embedder-Policy "require-corp";
#
# (Nie włączam tego domyślnie, bo te nagłówki mogą blokować niektóre
# zewnętrzne zasoby/iframy, jeśli kiedykolwiek dodasz np. reklamy AdMob web.)
# =====================================================================
